<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ícone da aba: monograma "BM" dentro de um mostrador de relógio, preto e branco -->
  <rect width="64" height="64" rx="14" fill="#000"/>
  <!-- Luneta (aro externo) e aro interno em cinza -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#fff" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#6b6b6b" stroke-width="0.8"/>
  <!-- Marcadores das 12, 3, 6 e 9 horas -->
  <path d="M32 7v5M57 32h-5M32 57v-5M7 32h5" stroke="#fff" stroke-width="1.6"/>
  <!-- Monograma serifado -->
  <text x="32" y="38.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" letter-spacing="0.5" fill="#fff">BM</text>
</svg>
